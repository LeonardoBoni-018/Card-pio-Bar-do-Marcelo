# Ambiente LOCAL: PostgreSQL + API. Copie .env.example para .env e preencha os segredos.
# (Em produção o banco é o Neon e a API roda no Render — veja render.yaml e backend/README.md.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/menu
      DB_USER: menu
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET (min. 32 caracteres)}
      APP_ADMIN_USER: ${APP_ADMIN_USER:?defina APP_ADMIN_USER}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?defina APP_ADMIN_PASSWORD (min. 8 caracteres)}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  pgdata:
