spring:
  application.name: menu-api
  datasource:
    # DB_URL aceita 'jdbc:postgresql://...' ou a string do Neon ('postgresql://user:senha@host/db?sslmode=require');
    # veja DatabaseUrlEnvironmentPostProcessor.
    url: ${DB_URL}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # Neon (plano free) suspende o compute após ~5 min parado e derruba as conexões: pool pequeno,
      # sem conexões ociosas e vida curta evitam usar conexões mortas; timeout cobre o "cold start".
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate:
      jdbc.batch_size: 25
      order_inserts: true
      order_updates: true
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 6MB
  mvc.problemdetails.enabled: true
  cache:
    type: caffeine
    cache-names: menu
    caffeine.spec: maximumSize=100,expireAfterWrite=10m

server:
  port: ${PORT:8080}                  # o Render define PORT
  forward-headers-strategy: native    # atrás do proxy do Render, usa o IP real (X-Forwarded-For)
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  shutdown: graceful
  error.include-message: never

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl: 8h
  admin:
    username: ${APP_ADMIN_USER}
    password: ${APP_ADMIN_PASSWORD}
  storage:
    max-dimension: 1200
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}  # separadas por vírgula; aceita curingas (https://app-*.vercel.app)
  login:
    max-failures: 5
    block-duration: 15m

springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
